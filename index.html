<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINJOB</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#121820;font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#0b1220;color:#fff;padding:28px 5vw 22px}.brand{font-weight:800;letter-spacing:.14em;font-size:24px}.sub{color:#aab4c4;margin-top:6px}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-12px}.stat,.panel{background:#fff;border:1px solid #e5e8ec;border-radius:16px}.stat{padding:18px}.stat b{font-size:26px;display:block}.stat span{color:#6b7280;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.toolbar input,.toolbar select,.toolbar button{border:1px solid #d9dde3;border-radius:10px;padding:11px 12px;background:white;font-size:14px}.toolbar input{flex:1;min-width:220px}.toolbar button.active{background:#0b1220;color:#fff}.grid{display:grid;grid-template-columns:1fr 310px;gap:18px}.jobs{display:flex;flex-direction:column;gap:10px}.job{background:#fff;border:1px solid #e5e8ec;border-radius:14px;padding:18px;cursor:pointer}.job:hover{box-shadow:0 8px 25px #1018280d}.top{display:flex;justify-content:space-between;gap:14px}.company{font-size:13px;color:#667085}.title{font-size:17px;font-weight:750;margin:5px 0 10px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;background:#f1f3f5;padding:5px 8px;border-radius:7px}.new{background:#e9f8ef;color:#16794b}.dday{font-weight:700;font-size:13px;white-space:nowrap}.save{border:0;background:none;font-size:19px;cursor:pointer}.panel{padding:18px;height:max-content;position:sticky;top:18px}.panel h3{margin-top:0}.muted{color:#667085;font-size:13px;line-height:1.6}.radar{display:flex;gap:7px;flex-wrap:wrap}.radar button{border:1px solid #d9dde3;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer}.radar button.on{background:#0b1220;color:#fff}.source{padding:11px 0;border-top:1px solid #eee;font-size:13px}.empty{text-align:center;color:#667085;padding:50px}.foot{font-size:12px;color:#98a2b3;margin-top:24px}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel{position:static}.stats{grid-template-columns:1fr 1fr}.wrap{padding:20px 14px}header{padding-left:20px}.job{padding:15px}}
</style></head><body><header><div class="brand">FINJOB</div><div class="sub">Finance opportunities, in one place.</div></header><main class="wrap"><section class="stats"><div class="stat"><b id="totalCount">0</b><span>진행 공고</span></div><div class="stat"><b id="newCount">0</b><span>최근 3일</span></div><div class="stat"><b id="weekCount">0</b><span>7일 내 마감</span></div><div class="stat"><b id="savedCount">0</b><span>저장</span></div></section><div class="toolbar"><input id="q" placeholder="회사명 또는 직무 검색"><select id="role"><option value="">전체 직무</option><option>리서치</option><option>IB</option><option>인프라·대체투자</option><option>FICC</option><option>자산운용</option><option>PE·VC</option><option>PF·부동산</option><option>리스크</option><option>디지털자산</option><option>기타</option></select><select id="career"><option value="">전체 경력</option><option>인턴</option><option>신입</option><option>경력</option><option>기타</option></select><select id="sort"><option value="deadline">마감 임박순</option><option value="new">신규순</option><option value="company">회사명순</option></select><button id="radarOnly">MY RADAR</button><button id="savedOnly">저장공고</button></div><div class="grid"><section><div id="jobs" class="jobs"></div><div class="foot">공식 채용페이지 및 금융투자협회 수집 결과만 표시합니다. 수집 실패 소스는 다른 소스의 갱신을 막지 않습니다.</div></section><aside class="panel"><h3>MY RADAR</h3><p class="muted">관심 직무를 선택하면 해당 태그가 붙은 공고만 빠르게 모아볼 수 있습니다.</p><div id="radar" class="radar"></div><div class="source"><b>Collector 상태</b><br><span id="status" class="muted">확인 중…</span></div></aside></div></main><script>
const ROLES=['리서치','IB','인프라·대체투자','PF·부동산','FICC','자산운용','PE·VC','리스크','디지털자산'];let jobs=[];let saved=new Set(JSON.parse(localStorage.getItem('finjobSaved')||'[]'));let radar=new Set(JSON.parse(localStorage.getItem('finjobRadar')||'["리서치","IB","인프라·대체투자"]'));let radarOnly=false,savedOnly=false;const today=new Date();today.setHours(0,0,0,0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dd(d){if(!d)return 9999;const x=new Date(d+'T23:59:59');return Math.ceil((x-today)/86400000)}function age(j){if(!j.posted&&!j.collected_at)return 9999;const x=new Date(j.posted||j.collected_at);return Math.floor((today-x)/86400000)}function active(j){return !j.deadline||dd(j.deadline)>=0}function renderRadar(){document.querySelector('#radar').innerHTML=ROLES.map(r=>`<button class="${radar.has(r)?'on':''}" onclick="toggleRadar('${r}')">${r}</button>`).join('')}
function render(){const q=document.querySelector('#q').value.toLowerCase(),r=document.querySelector('#role').value,c=document.querySelector('#career').value,s=document.querySelector('#sort').value;let list=jobs.filter(active).filter(j=>(!q||(j.company+' '+j.title+' '+(j.tags||[]).join(' ')).toLowerCase().includes(q))&&(!r||(j.tags||[]).includes(r))&&(!c||j.career===c)&&(!radarOnly||(j.tags||[]).some(x=>radar.has(x)))&&(!savedOnly||saved.has(j.id)));list.sort((a,b)=>s==='company'?a.company.localeCompare(b.company,'ko'):s==='new'?age(a)-age(b):(dd(a.deadline)-dd(b.deadline)));document.querySelector('#jobs').innerHTML=list.length?list.map(j=>`<article class="job" onclick="window.open('${esc(j.url)}','_blank','noopener')"><div class="top"><div><div class="company">${esc(j.company)} · ${esc(j.source)}</div><div class="title">${esc(j.title)}</div><div class="tags">${age(j)<=3?'<span class="tag new">NEW</span>':''}<span class="tag">${esc(j.career)}</span>${(j.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div><div class="dday">${!j.deadline?'상시/미정':dd(j.deadline)===0?'오늘 마감':'D-'+dd(j.deadline)}</div><button class="save" onclick="event.stopPropagation();toggleSave('${j.id}')">${saved.has(j.id)?'★':'☆'}</button></div></div></article>`).join(''):'<div class="empty">조건에 맞는 공고가 없습니다.</div>';const act=jobs.filter(active);document.querySelector('#totalCount').textContent=act.length;document.querySelector('#newCount').textContent=act.filter(j=>age(j)<=3).length;document.querySelector('#weekCount').textContent=act.filter(j=>dd(j.deadline)>=0&&dd(j.deadline)<=7).length;document.querySelector('#savedCount').textContent=saved.size;document.querySelector('#radarOnly').classList.toggle('active',radarOnly);document.querySelector('#savedOnly').classList.toggle('active',savedOnly)}
function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('finjobSaved',JSON.stringify([...saved]));render()}function toggleRadar(r){radar.has(r)?radar.delete(r):radar.add(r);localStorage.setItem('finjobRadar',JSON.stringify([...radar]));renderRadar();render()}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',render));document.querySelector('#radarOnly').onclick=()=>{radarOnly=!radarOnly;render()};document.querySelector('#savedOnly').onclick=()=>{savedOnly=!savedOnly;render()};renderRadar();Promise.all([fetch('./jobs.json').then(r=>r.json()),fetch('./collector_status.json').then(r=>r.json()).catch(()=>null)]).then(([data,st])=>{jobs=Array.isArray(data)?data:[];if(st){document.querySelector('#status').textContent=(st.sources||[]).map(x=>`${x.adapter}: ${x.ok?'정상 '+x.count+'건':'오류'}`).join(' · ')}else document.querySelector('#status').textContent='상태 파일 없음';render()}).catch(()=>document.querySelector('#jobs').innerHTML='<div class="empty">데이터를 불러오지 못했습니다. 로컬 서버로 실행해주세요.</div>');
</script></body></html>
